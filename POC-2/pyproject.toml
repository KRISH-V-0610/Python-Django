[project]
name = "django-poc-2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.3",
    "psycopg[binary]>=3.3.8",
    # pinned: newer pydantic needs a later Python 3.14 than the 3.14.0rc1 uv gives us
    "pydantic==2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
